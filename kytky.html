<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trhání kytek - Diančiny hrátky</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
            background: linear-gradient(to bottom, #d4fc79 0%, #96e6a1 100%);
            text-align: center;
            margin: 0;
            padding: 5px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 8px;
            height: 88vh; /* Zkráceno, aby vše vyjelo výš před lištu Netlify */
            user-select: none;
            overflow: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 6px 15px;
            border-radius: 12px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
            margin: 5px 10px 0 10px;
        }
        h1 {
            color: #2c3e50;
            font-size: 1.0rem;
            margin: 0;
        }
        .bouquet-preview {
            font-size: 1.1rem;
            background: #fff3cd;
            padding: 3px 8px;
            border-radius: 8px;
            border: 2px dashed #ffecb5;
        }
        /* Hlavní herní plocha - posunuta výš a zkompaktněna */
        .game-card {
            background: white;
            border-radius: 20px;
            padding: 10px 15px;
            width: 92%;
            max-width: 450px;
            margin: 0 auto;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .speaker-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            font-size: 1.8rem;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }
        .speaker-btn:active { transform: scale(0.9); }
        
        .hint-text {
            font-size: 0.8rem;
            color: #666;
            margin: 0;
        }

        /* Políčka pro skládání slova */
        .slot-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            min-height: 45px;
            margin: 2px 0;
            flex-wrap: wrap;
        }
        .letter-slot {
            width: 40px;
            height: 45px;
            border: 3px dashed #4dabf7;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: bold;
            color: #333;
            background: #f8f9fa;
            cursor: pointer;
        }
        .letter-slot.filled {
            border-style: solid;
            background: #e7f5ff;
            border-color: #339af0;
            color: #1c7ed6;
        }

        /* Výběr písmen (Logo Quiz styl) */
        .pool-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 2px;
        }
        .letter-tile {
            width: 40px;
            height: 40px;
            background: #fab005;
            color: white;
            font-size: 1.6rem;
            font-weight: bold;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            transition: transform 0.1s, opacity 0.2s;
            border-bottom: 3px solid #e67700;
        }
        .letter-tile:active {
            transform: scale(0.9);
        }
        .letter-tile.used {
            opacity: 0.2;
            pointer-events: none;
            background: #adb5bd;
            border-color: #6c757d;
        }

        .message {
            font-size: 1.1rem;
            height: 22px;
            font-weight: bold;
            color: #2b8a3e;
        }

        /* Přechodová obrazovka / Konec kola */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 10;
        }
        .overlay h2 { font-size: 2.3rem; margin-bottom: 5px; }
        .overlay p { font-size: 1.2rem; margin-bottom: 20px; text-align: center; padding: 0 20px; }
        .big-bouquet { font-size: 4.5rem; margin: 10px 0; }
        .btn {
            background: #2b8a3e;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.4rem;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }
        .btn:active { transform: scale(0.95); }
        .hidden { display: none !important; }
        .back-link {
            position: absolute;
            top: 8px;
            left: 10px;
            background: white;
            padding: 4px 10px;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            font-size: 0.85rem;
            z-index: 5;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">⬅️ Zpět do menu</a>

        <div class="message" id="message">Poskládej slovo z písmen</div>

        <!-- Prázdná políčka pro slovo -->
        <div class="slot-container" id="slotContainer"></div>

        <!-- Výběr písmen -->
        <div class="pool-container" id="poolContainer"></div>
